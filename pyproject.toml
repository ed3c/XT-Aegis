[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xt-aegis"
version = "0.2.0"
description = "Evidence-first deterministic safety and verification harness for AI agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ed3c" }]
keywords = ["ai-agents", "agent-runtime", "prompt-injection", "sandbox", "mcp", "checkpointing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mcp[cli]>=1.26,<3",
  "mypy>=1.11,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
]
mcp = ["mcp[cli]>=1.26,<3"]
postgres = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
xt-aegis = "xt_aegis.cli:main"
xt-aegis-mcp = "xt_aegis.mcp_server:main"
xt-aegis-verifier-mcp = "xt_aegis.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ed3c/XT-Aegis"
Repository = "https://github.com/ed3c/XT-Aegis"
Issues = "https://github.com/ed3c/XT-Aegis/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xt_aegis = [
  "demo_assets/*.md",
  "demo_assets/template/sample_project/*.py",
  "verification_assets/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["xt_aegis"]
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["xt_aegis"]
omit = ["src/xt_aegis/__main__.py", "src/xt_aegis/mcp_server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
