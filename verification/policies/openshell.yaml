version: 1

# The verifier uploads the selected source revision into /workspace. This is a
# disposable sandbox copy; no host path is mounted by this policy. Recipes
# remain argv-only and are additionally constrained by PROJECT_EVIDENCE.json
# and xt_aegis.sandbox_exec.
filesystem_policy:
  include_workdir: true
  # Every entry must be a directory. OpenShell grants `ReadDir` on each path it is given, and Landlock
  # rejects that right on anything that is not a directory:
  #
  #   Failed to prepare sandbox: incompatible directory-only access-rights: BitFlags<AccessFs>(0b1000, ReadDir)
  #
  # `/dev/urandom` and `/dev/null` are character devices, so naming them here failed the whole sandbox
  # before any recipe ran. `/dev` covers both at the only granularity Landlock accepts.
  read_only:
    - /usr
    - /lib
    - /proc
    - /etc
    - /var/log
    - /opt/xt-aegis
  read_write:
    - /sandbox
    - /workspace
    - /tmp
    - /dev

# A runtime that cannot enforce Landlock must reject this policy rather than
# silently weakening the filesystem boundary.
landlock:
  compatibility: hard_requirement

# OpenShell v0.0.52 and the OpenShell Community base image use this
# unprivileged workload identity.
process:
  run_as_user: sandbox
  run_as_group: sandbox

# Empty means default-deny egress. Verification recipes cannot add endpoints,
# credentials, providers, or policy revisions.
network_policies: {}
