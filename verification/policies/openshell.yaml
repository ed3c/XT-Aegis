version: 1

# The verifier uploads the selected source revision into the sandbox working
# directory. This is a disposable copy; no host path is mounted by this policy.
# Recipes remain argv-only and are additionally constrained by
# PROJECT_EVIDENCE.json and xt_aegis.sandbox_exec.
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

# A runtime that cannot enforce Landlock must reject this policy rather than
# silently weakening the filesystem boundary.
landlock:
  compatibility: hard_requirement

# This identity is created by Dockerfile.verifier and owns /workspace.
process:
  run_as_user: verifier
  run_as_group: verifier

# Empty means default-deny egress. Verification recipes cannot add endpoints,
# credentials, providers, or policy revisions.
network_policies: {}
