name: Verifier image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build verifier image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verifier
          load: true
          push: false
          tags: xt-aegis-verifier:test
      - name: Inspect packaged verifier
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 1g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=536870912 \
            xt-aegis-verifier:test \
            xt-aegis doctor --backend unsafe-local

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and publish verifier image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verifier
          push: true
          tags: |
            ghcr.io/ed3c/xt-aegis-verifier:${{ github.ref_name }}
            ghcr.io/ed3c/xt-aegis-verifier:latest
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/ed3c/xt-aegis-verifier
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
