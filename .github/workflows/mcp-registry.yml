name: MCP Registry metadata

on:
  pull_request:
    paths:
      - "server.json"
      - "README.md"
      - "Dockerfile.verifier"
      - ".github/workflows/mcp-registry.yml"
  push:
    branches: [main]
    paths:
      - "server.json"
      - "README.md"
      - "Dockerfile.verifier"
      - ".github/workflows/mcp-registry.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "v1.8.1"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --version

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish server metadata
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/mcp-publisher.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
