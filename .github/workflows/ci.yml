name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test with coverage
        run: pytest --cov=xt_aegis --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run deterministic demo
        run: xt-aegis demo --output-dir /tmp/xt-aegis-ci-demo

      - name: Verify claim contract
        if: matrix.python-version == '3.12'
        run: |
          xt-aegis verify --all --backend unsafe-local --output-dir /tmp/xt-aegis-verification
          xt-aegis evidence pack \
            --input /tmp/xt-aegis-verification \
            --output /tmp/xt-aegis-verification.tar.gz

      - name: Upload verification evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: /tmp/xt-aegis-verification.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl "mcp[cli]>=1.26,<3"
      - run: xt-aegis demo --output-dir /tmp/xt-aegis-wheel-demo
      - run: xt-aegis doctor --backend unsafe-local
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
