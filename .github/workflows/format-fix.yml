name: Format source (temporary)

on:
  push:
    branches:
      - feat/external-verification-plane
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/format-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-verification-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.2"
      - run: ruff format src tests
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "style: format verification source"
          git push origin HEAD:feat/external-verification-plane
