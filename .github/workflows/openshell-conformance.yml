name: OpenShell conformance

on:
  pull_request:
    paths:
      - "src/xt_aegis/verification.py"
      - "src/xt_aegis/sandbox_exec.py"
      - "tests/test_verification.py"
      - "tests/test_sandbox_exec.py"
      - "tests/test_openshell_assets.py"
      - "verification/policies/openshell.yaml"
      - "Dockerfile.verifier"
      - ".github/workflows/openshell-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openshell-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSHELL_VERSION: "v0.0.52"
  OPENSHELL_INSTALLER_COMMIT: "7873f61"
  OPENSHELL_TELEMETRY_ENABLED: "false"
  OPENSHELL_BASE_IMAGE: "ghcr.io/nvidia/openshell-community/sandboxes/base@sha256:aeef1c63f00e2913ea002ccb3aaf925f338b5c5d70e63576f0d95c16a138044e"
  XT_AEGIS_OPENSHELL_IMAGE: "xt-aegis-verifier:conformance"

jobs:
  conformance:
    name: OpenShell v0.0.52 / Docker driver
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare deterministic runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-out/runtime "$HOME/.config/openshell"
          cat > "$HOME/.config/openshell/gateway.toml" <<'TOML'
          [openshell]
          version = 1

          [openshell.gateway]
          compute_drivers = ["docker"]

          [openshell.drivers.docker]
          image_pull_policy = "IfNotPresent"
          TOML
          printf '%s\n' 'OPENSHELL_DRIVERS=docker' > "$HOME/.config/openshell/gateway.env"
          cp "$HOME/.config/openshell/gateway.toml" verification-out/runtime/gateway.toml
          docker version > verification-out/runtime/docker-version.txt
          docker info > verification-out/runtime/docker-info.txt

      - name: Install XT-Aegis
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp]"

      - name: Build source-matched verifier image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg "OPENSHELL_BASE_IMAGE=${OPENSHELL_BASE_IMAGE}" \
            --file Dockerfile.verifier \
            --tag "${XT_AEGIS_OPENSHELL_IMAGE}" \
            .
          docker manifest inspect "${OPENSHELL_BASE_IMAGE}" \
            > verification-out/runtime/openshell-base-manifest.json
          docker image inspect "${XT_AEGIS_OPENSHELL_IMAGE}" \
            > verification-out/runtime/verifier-image.json

      - name: Install pinned OpenShell release
        shell: bash
        run: |
          set -euo pipefail
          installer=/tmp/openshell-install.sh
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_INSTALLER_COMMIT}/install.sh" \
            --output "${installer}"
          sha256sum "${installer}" | tee verification-out/runtime/installer.sha256
          OPENSHELL_VERSION="${OPENSHELL_VERSION}" \
          OPENSHELL_ACK_BREAKING_UPGRADE=1 \
            sh "${installer}" 2>&1 \
            | tee verification-out/runtime/openshell-install.log
          openshell --version | tee verification-out/runtime/openshell-version.txt

      - name: Wait for local gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if openshell status \
              > verification-out/runtime/openshell-status.txt \
              2> verification-out/runtime/openshell-status.err; then
              cat verification-out/runtime/openshell-status.txt
              exit 0
            fi
            sleep 2
          done
          cat verification-out/runtime/openshell-status.err >&2
          exit 1

      - name: Inspect backend without executing claim recipes
        shell: bash
        run: |
          set -euo pipefail
          xt-aegis doctor --backend openshell --format json \
            | tee verification-out/runtime/doctor.json
          openshell status \
            | tee verification-out/runtime/openshell-status-final.txt

      - name: Verify implemented claims in OpenShell
        shell: bash
        run: |
          set -euo pipefail
          xt-aegis verify --all --backend openshell --format json \
            --output-dir verification-out \
            | tee verification-out/runtime/command-summary.json

      - name: Capture gateway diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          systemctl --user status openshell-gateway --no-pager \
            > verification-out/runtime/gateway-service.txt 2>&1
          journalctl --user -u openshell-gateway --no-pager -n 300 \
            > verification-out/runtime/gateway-journal.txt 2>&1
          openshell gateway info \
            > verification-out/runtime/gateway-info.txt 2> verification-out/runtime/gateway-info.err
          openshell sandbox list \
            > verification-out/runtime/sandboxes.txt 2> verification-out/runtime/sandboxes.err
          # The gateway journal reports that a sandbox container restarted after a failure, but not why.
          # Without the container's own state and logs the next reader has to re-derive that from the
          # client-side error, which is where issue #12's investigation stalled.
          docker ps --all --no-trunc --format '{{json .}}' \
            > verification-out/runtime/containers.json 2> verification-out/runtime/containers.err
          for container in $(docker ps --all --quiet | head -20); do
            docker inspect "${container}" \
              >> verification-out/runtime/container-inspect.json 2>&1
            {
              printf '=== %s ===\n' "${container}"
              docker logs --tail 200 "${container}" 2>&1
            } >> verification-out/runtime/container-logs.txt
          done
          exit 0

      - name: Pack deterministic verification evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          xt-aegis evidence pack \
            --input verification-out \
            --output xt-aegis-openshell-evidence.tar.gz \
            --format json \
            | tee evidence-bundle.json

      - name: Pack deterministic failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf xt-aegis-openshell-diagnostics.tar.gz \
            verification-out
          sha256sum xt-aegis-openshell-diagnostics.tar.gz \
            | tee diagnostics-bundle.sha256

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openshell-conformance-${{ github.sha }}
          path: |
            verification-out/
            xt-aegis-openshell-evidence.tar.gz
            evidence-bundle.json
            xt-aegis-openshell-diagnostics.tar.gz
            diagnostics-bundle.sha256
          if-no-files-found: warn
          retention-days: 14
