name: Apply OpenShell sandbox identity patch

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/apply_openshell_sandbox_identity_patch.py"
      - ".github/workflows/apply-openshell-sandbox-identity-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openshell-source-bound-verification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply_openshell_sandbox_identity_patch.py
      - name: Commit patched files
        run: |
          set -euo pipefail
          rm scripts/apply_openshell_sandbox_identity_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/xt_aegis/verification.py tests/test_verification.py tests/test_openshell_assets.py docs/OPENSHELL.md scripts/apply_openshell_sandbox_identity_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: align OpenShell verification with the sandbox identity"
          git push origin HEAD:fix/openshell-source-bound-verification
