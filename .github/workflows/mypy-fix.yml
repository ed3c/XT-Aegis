name: Mypy fix (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - ".github/workflows/mypy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-first-agent-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Apply strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          mcp = Path("src/xt_aegis/mcp_server.py")
          text = mcp.read_text(encoding="utf-8")
          text = text.replace(
              "from mcp.server.fastmcp import FastMCP\n",
              "from mcp.server.fastmcp import FastMCP  # type: ignore[import-not-found]\n",
          )
          text = text.replace(
              "    @server.tool()\n",
              "    @server.tool()  # type: ignore[untyped-decorator]\n",
          )
          mcp.write_text(text, encoding="utf-8")

          runner = Path("src/xt_aegis/runner.py")
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              '        action_stderr = ""\n\n        try:\n',
              '        action_stderr = ""\n        rollback_integrity: bool | None = None\n\n        try:\n',
              1,
          )
          text = text.replace(
              "        except (OSError, subprocess.SubprocessError, WorkspaceSafetyError) as exc:\n"
              "            rollback_integrity: bool | None = None\n",
              "        except (OSError, subprocess.SubprocessError, WorkspaceSafetyError) as exc:\n"
              "            rollback_integrity = None\n",
              1,
          )
          runner.write_text(text, encoding="utf-8")

          demo_test = Path("src/xt_aegis/demo_assets/template/sample_project/test_app.py")
          text = demo_test.read_text(encoding="utf-8").replace(
              "from app import calculate_tax\n",
              "from app import calculate_tax  # type: ignore[import-not-found]\n",
              1,
          )
          demo_test.write_text(text, encoding="utf-8")
          PY
          ruff format src
          ruff check src
          mypy src
          pytest -q
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy strict typing checks"
          git push origin HEAD:feat/evidence-first-agent-runtime
