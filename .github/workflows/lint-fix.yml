name: Lint source (temporary)

on:
  push:
    branches:
      - feat/external-verification-plane
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/lint-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-verification-plane
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.2"
      - name: Apply targeted and automatic lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verification = Path("src/xt_aegis/verification.py")
          text = verification.read_text(encoding="utf-8")
          text = text.replace("import tempfile\n", "")
          old = (
              '    with destination.open("wb") as raw_handle:\n'
              '        with gzip.GzipFile(filename="", mode="wb", fileobj=raw_handle, mtime=0) as compressed:\n'
              '            compressed.write(tar_buffer.getvalue())\n'
          )
          new = (
              '    with destination.open("wb") as raw_handle, gzip.GzipFile(\n'
              '        filename="", mode="wb", fileobj=raw_handle, mtime=0\n'
              '    ) as compressed:\n'
              '        compressed.write(tar_buffer.getvalue())\n'
          )
          text = text.replace(old, new)
          verification.write_text(text, encoding="utf-8")

          test_file = Path("tests/test_mcp_verification.py")
          text = test_file.read_text(encoding="utf-8")
          text = text.replace(
              "import json\nfrom pathlib import Path\nfrom typing import Any, Callable\n",
              "import json\nfrom collections.abc import Callable\nfrom pathlib import Path\nfrom typing import Any\n",
          )
          test_file.write_text(text, encoding="utf-8")
          PY
          ruff check src tests --fix --unsafe-fixes
          ruff format src tests
          ruff check src tests
      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "style: apply verification lint fixes"
          git push origin HEAD:feat/external-verification-plane
