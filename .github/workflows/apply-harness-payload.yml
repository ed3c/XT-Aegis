name: Apply Harness payload

on:
  push:
    branches:
      - agent/harness-request-identity-exit-contract
    paths:
      - .github/workflows/apply-harness-payload.yml
      - .xt-aegis-harness-payload.part-*

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/harness-request-identity-exit-contract
          fetch-depth: 0

      - name: Verify and apply the deterministic payload
        shell: bash
        run: |
          set -euo pipefail
          cat .xt-aegis-harness-payload.part-* > /tmp/xt-aegis-harness-payload.b64
          base64 --decode /tmp/xt-aegis-harness-payload.b64 > /tmp/xt-aegis-harness-payload.tar.gz
          echo "7853ebce4e64bd2b363225eb509f7df9b8771f108e7b75d346b498bf573e68f6  /tmp/xt-aegis-harness-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/xt-aegis-harness-payload.tar.gz
          rm -f .xt-aegis-harness-payload.part-*
          rm -f .github/workflows/apply-harness-payload.yml

      - name: Commit the exact Harness changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind Harness requests and honor declared exits"
          git push origin HEAD:agent/harness-request-identity-exit-contract
