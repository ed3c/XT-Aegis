name: Ruff autofix (temporary)

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/ruff-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-first-agent-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.2"
      - name: Apply Ruff fixes
        run: |
          ruff check . --fix --unsafe-fixes || true
          python - <<'PY'
          from pathlib import Path

          path = Path("src/xt_aegis/policy.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          target = 'if executable in {"python", "python3", "node", "ruby", "perl", "bash", "sh"}:'
          for index, line in enumerate(lines):
              if line.strip() != target:
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              if index + 2 >= len(lines) or not lines[index + 1].strip().startswith("if any("):
                  raise SystemExit("unexpected nested policy condition")
              reason_line = lines[index + 2].strip()
              lines[index : index + 3] = [
                  indent + 'if executable in {"python", "python3", "node", "ruby", "perl", "bash", "sh"} and any(',
                  indent + "    argument in _INTERPRETER_INLINE_CODE_FLAGS for argument in command.argv[1:]",
                  indent + "):",
                  indent + "    " + reason_line,
              ]
              break
          else:
              raise SystemExit("expected nested policy condition was not found")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          ruff format .
          ruff check .
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git diff --cached --quiet && exit 0
          git commit -m "style: apply Ruff fixes"
          git push origin HEAD:feat/evidence-first-agent-runtime
