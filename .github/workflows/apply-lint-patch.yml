name: Apply Ruff lint patch

on:
  push:
    branches:
      - agent/harness-request-identity-exit-contract
    paths:
      - .github/workflows/apply-lint-patch.yml
      - .xt-aegis-lint.patch

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/harness-request-identity-exit-contract
          fetch-depth: 0

      - name: Verify and apply the lint patch
        shell: bash
        run: |
          set -euo pipefail
          echo "ec641cc7925f4441d71b6070ac8a0dae8b28e9d9e9d6631b04d497e0cada8890  .xt-aegis-lint.patch" | sha256sum --check -
          git apply --check .xt-aegis-lint.patch
          git apply .xt-aegis-lint.patch
          rm -f .xt-aegis-lint.patch
          rm -f .github/workflows/apply-lint-patch.yml

      - name: Commit the exact lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: satisfy Ruff lint"
          git push origin HEAD:agent/harness-request-identity-exit-contract
