name: Format OpenShell change

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/xt_aegis/verification.py"
      - "src/xt_aegis/sandbox_exec.py"
      - "tests/test_verification.py"
      - "tests/test_sandbox_exec.py"
      - ".github/workflows/format-openshell-pr.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openshell-source-bound-verification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install "ruff==0.16.2"

      - name: Format and autofix
        run: |
          ruff format src/xt_aegis/verification.py src/xt_aegis/sandbox_exec.py tests/test_verification.py tests/test_sandbox_exec.py
          ruff check --fix src/xt_aegis/verification.py src/xt_aegis/sandbox_exec.py tests/test_verification.py tests/test_sandbox_exec.py

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/xt_aegis/verification.py src/xt_aegis/sandbox_exec.py tests/test_verification.py tests/test_sandbox_exec.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format OpenShell source-bound verification"
          git push origin HEAD:fix/openshell-source-bound-verification
